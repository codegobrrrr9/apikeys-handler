<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0b0f14"/>
  <text x="80" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" fill="#c9d4e0" font-weight="bold">Every secret, in the order that matters</text>
  <text x="80" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8899aa">apikeys-handler plan, on the demo project (made-up data). It prints names, never values.</text>
  <rect x="80" y="195" width="1440" height="610" rx="16" fill="#111821" stroke="#1f2a36" stroke-width="2"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="23">
    <text x="115" y="245" fill="#8899aa">$ apikeys-handler plan --environment production --exposed web</text>
    <text x="115" y="285" fill="#c9d4e0">15 rotations · P0 5 · P1 6 · P2 4 · 6 writes + 5 restarts = 11 requests</text>
    <text x="115" y="340" fill="#ff6b6b" font-weight="bold">P0</text><text x="175" y="340" fill="#c9d4e0">Database   PGPASSWORD              <tspan fill="#ffd166">[manual]</tspan>    Postgres</text>
    <text x="115" y="378" fill="#ff6b6b" font-weight="bold">P0</text><text x="175" y="378" fill="#c9d4e0">Auth       APP_KEY                 <tspan fill="#7ee787">[generate]</tspan>  web</text>
    <text x="115" y="416" fill="#ff6b6b" font-weight="bold">P0</text><text x="175" y="416" fill="#c9d4e0">Auth       SESSION_SECRET          <tspan fill="#7ee787">[generate]</tspan>  (shared)</text>
    <text x="115" y="454" fill="#ff6b6b" font-weight="bold">P0</text><text x="175" y="454" fill="#c9d4e0">Payments   STRIPE_SECRET_KEY       <tspan fill="#58a6ff">[provider]</tspan>  web</text>
    <text x="115" y="492" fill="#ff6b6b" font-weight="bold">P0</text><text x="175" y="492" fill="#c9d4e0">Payments   STRIPE_WEBHOOK_SECRET   <tspan fill="#58a6ff">[provider]</tspan>  web</text>
    <text x="115" y="530" fill="#ffb454" font-weight="bold">P1</text><text x="175" y="530" fill="#c9d4e0">Auth       JWT_SECRET              <tspan fill="#7ee787">[generate]</tspan>  api, worker  <tspan fill="#8899aa">(2 places, one value)</tspan></text>
    <text x="115" y="568" fill="#ffb454" font-weight="bold">P1</text><text x="175" y="568" fill="#c9d4e0">Database   REDIS_URL               <tspan fill="#ffd166">[manual]</tspan>    api, worker</text>
    <text x="115" y="606" fill="#ffb454" font-weight="bold">P1</text><text x="175" y="606" fill="#c9d4e0">Cloud      AWS_SECRET_ACCESS_KEY   <tspan fill="#58a6ff">[provider]</tspan>  api</text>
    <text x="115" y="644" fill="#6b7a8c">…</text>
    <text x="115" y="700" fill="#c9d4e0">restart order: api → Postgres → web</text>
    <text x="115" y="745" fill="#8899aa">skipped: web DATABASE_URL: built from other variables, rotate the source</text>
  </g>
  <text x="80" y="850" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#6b7a8c">github.com/codegobrrrr9/apikeys-handler · generated only for secrets your app owns · values never stored</text>
</svg>
